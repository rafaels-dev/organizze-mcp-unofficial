name: Publish Docker image

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists on Docker Hub
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/organizze-mcp-unofficial"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}/")

          if [ "$STATUS" = "200" ]; then
            echo "::notice::Version ${VERSION} is already on Docker Hub, skipping publish. Bump the version in package.json to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag commit on GitHub
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Log in to Docker Hub
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        if: steps.check.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/organizze-mcp-unofficial:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/organizze-mcp-unofficial:${{ steps.pkg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove tag if build failed
        if: failure()
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git push origin --delete "v${VERSION}" || true
